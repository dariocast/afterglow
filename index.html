<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Afterglow is a small social space for conversations with a natural ending." />
  <meta name="theme-color" content="#0a0b0e" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Afterglow — keep the moment, not the archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Static shell / progressive enhancement fallback -->
    <noscript>
      <header class="topbar">
        <a class="brand" href="#top" aria-label="Afterglow home"><span class="brand-mark"></span> afterglow</a>
      </header>
      <main id="top" class="shell">
        <section class="intro-grid">
          <div>
            <h1>Good things<br /><em>can end.</em></h1>
          </div>
        </section>
        <section class="composer-card">
          <form id="post-form"></form>
        </section>
        <section class="feed-section">
          <div id="feed" class="feed"></div>
        </section>
      </main>
    </noscript>
  </div>
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
