name: ci

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run static contract test
        run: python3 test_static.py
      - name: Verify HTTP assets
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/afterglow-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          python3 - <<'PY'
          import urllib.request
          for path in ('/', '/styles.css', '/app.js'):
              response = urllib.request.urlopen('http://127.0.0.1:8766' + path)
              assert response.status == 200
          print('HTTP smoke test: PASS')
          PY
